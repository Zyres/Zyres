<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 308" width="1200" height="308" role="img" aria-label="Languages and commits per year">
<defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ed00e1"/><stop offset="1" stop-color="#fc0000"/></linearGradient>
