<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GitHub statistics">
<defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ed00e1"/><stop offset="1" stop-color="#fc0000"/></linearGradient>
<linearGradient id="mgv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ed00e1"/><stop offset="1" stop-color="#fc0000"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath></defs>
<style>
  .in { opacity: 0; animation: in .7s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .grow { transform-box: fill-box; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .growx { transform-origin: left center; } .growy { transform-origin: center bottom; }
  @keyframes grow { from { transform: scale(0, 1); } to { transform: scale(1, 1); } }
  .growy { animation-name: growy; } @keyframes growy { from { transform: scale(1, 0); } to { transform: scale(1, 1); } }
  @media (prefers-reduced-motion: reduce) { .in, .grow { animation: none; opacity: 1; } }
</style>
<g clip-path="url(#frame)"><rect width="1200" height="320" fill="#ffffff"/></g>
<rect x=".5" y=".5" width="1199" height="319" rx="15.5" fill="none" stroke="#e4e4e4"/>
<g font-family="Roboto, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="28" y="28" width="34" height="4" rx="2" fill="url(#mg)"/>
  <text x="28" y="58" font-size="20" font-weight="600" fill="#161616">GitHub at a glance</text>
  <text x="1172" y="58" font-size="12.5" fill="#777777" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" text-anchor="end">since 2014 · updated 2026-11-14</text>
  <g class="in" style="animation-delay:0.00s">
  <rect x="28" y="80" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="46" y="106" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">COMMITS</text>
  <text x="46" y="140" font-size="32" font-weight="700" fill="url(#mg)">5,667</text>
  <text x="46" y="164" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">603 in 2026</text>
</g>
<g class="in" style="animation-delay:0.06s">
  <rect x="316" y="80" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="334" y="106" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">ISSUES SOLVED</text>
  <text x="334" y="140" font-size="32" font-weight="700" fill="url(#mg)">470</text>
  <text x="334" y="164" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">closed by me or my commits</text>
</g>
<g class="in" style="animation-delay:0.12s">
  <rect x="604" y="80" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="622" y="106" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">PULL REQUESTS</text>
  <text x="622" y="140" font-size="32" font-weight="700" fill="#161616">28</text>
  <text x="622" y="164" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">24 merged</text>
</g>
<g class="in" style="animation-delay:0.18s">
  <rect x="892" y="80" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="910" y="106" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">CODE REVIEWS</text>
  <text x="910" y="140" font-size="32" font-weight="700" fill="#161616">44</text>
  <text x="910" y="164" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">pull request reviews</text>
</g>
<g class="in" style="animation-delay:0.24s">
  <rect x="28" y="192" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="46" y="218" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">CONTRIBUTIONS</text>
  <text x="46" y="252" font-size="32" font-weight="700" fill="#161616">6,034</text>
  <text x="46" y="276" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">630 in 2026</text>
</g>
<g class="in" style="animation-delay:0.30s">
  <rect x="316" y="192" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="334" y="218" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">ISSUES OPENED</text>
  <text x="334" y="252" font-size="32" font-weight="700" fill="#161616">222</text>
  <text x="334" y="276" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">reported and tracked</text>
</g>
<g class="in" style="animation-delay:0.36s">
  <rect x="604" y="192" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="622" y="218" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">CURRENT STREAK</text>
  <text x="622" y="252" font-size="32" font-weight="700" fill="#161616">0 d</text>
  <text x="622" y="276" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">days in a row</text>
</g>
<g class="in" style="animation-delay:0.42s">
  <rect x="892" y="192" width="276" height="100" rx="12" fill="#f4f4f4" stroke="#e4e4e4"/>
  <text x="910" y="218" font-size="11" font-weight="600" fill="#777777" letter-spacing="1.2">LONGEST STREAK</text>
  <text x="910" y="252" font-size="32" font-weight="700" fill="#161616">47 d</text>
  <text x="910" y="276" font-size="12" fill="#383838" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">13 years of history</text>
</g>
</g>
</svg>
