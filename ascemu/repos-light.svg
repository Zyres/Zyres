<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-label="Repositories with the most commits">
<defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4600d"/><stop offset="1" stop-color="#7a3504"/></linearGradient>
<linearGradient id="mgv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c4600d"/><stop offset="1" stop-color="#7a3504"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="324" rx="16"/></clipPath></defs>
<style>
  .in { opacity: 0; animation: in .7s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .grow { transform-box: fill-box; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .growx { transform-origin: left center; } .growy { transform-origin: center bottom; }
  @keyframes grow { from { transform: scale(0, 1); } to { transform: scale(1, 1); } }
  .growy { animation-name: growy; } @keyframes growy { from { transform: scale(1, 0); } to { transform: scale(1, 1); } }
  @media (prefers-reduced-motion: reduce) { .in, .grow { animation: none; opacity: 1; } }
</style>
<g clip-path="url(#frame)"><rect width="1200" height="324" fill="#faf6f1"/><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#aa5e18" stroke-opacity=".07"/></pattern><rect width="1200" height="324" fill="url(#grid)"/></g>
<rect x=".5" y=".5" width="1199" height="323" rx="15.5" fill="none" stroke="#e6dccf"/>
<g font-family="Roboto, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="28" y="28" width="34" height="4" rx="2" fill="url(#mg)"/>
  <text x="28" y="58" font-size="20" font-weight="600" fill="#231a12">Where my commits go</text>
  <text x="1172" y="58" font-size="12.5" fill="#8a7b6c" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" text-anchor="end">7 public repositories</text>
  <g class="in" style="animation-delay:0.00s">
  <text x="28" y="92" font-size="15.5" font-weight="600" fill="#231a12">AscEmu/AscEmu</text>
  <rect class="grow growx" style="animation-delay:0.20s" x="420" y="81" width="380.0" height="12" rx="6" fill="url(#mg)" fill-opacity="1"/>
  <text x="810.0" y="92" font-size="13" fill="#5d4f42" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">5,169 commits</text>
  <circle cx="1010" cy="87" r="6" fill="#f34b7d"/><text x="1022" y="92" font-size="13" fill="#5d4f42">C++</text>
  <text x="1172" y="92" font-size="13" fill="#5d4f42" text-anchor="end">★ 115</text>
</g>
